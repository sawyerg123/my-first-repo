<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Sawyer G | Creative Technologist</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Three.js core -->
  <script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>
  <!-- Postprocessing utilities (CommonJS builds) -->
  <script src="https://unpkg.com/three@0.160.1/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://unpkg.com/three@0.160.1/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://unpkg.com/three@0.160.1/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://unpkg.com/three@0.160.1/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://unpkg.com/three@0.160.1/examples/js/shaders/RGBShiftShader.js"></script>
  <!-- GSAP for easing / timing -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
  <!-- dat.GUI for tweaking (optional) -->
  <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.7/build/dat.gui.min.js"></script>
</head>
<body>
  <!-- Overlay content -->
  <div id="overlay">
    <h1 class="name">Sawyer&nbsp;G</h1>
    <p class="role">HCDD Student &nbsp;&bull;&nbsp; Creative Developer</p>
  </div>
  <!-- The WebGL canvas will be injected by Three.js -->
  <canvas id="webgl"></canvas>
  <!-- Load the main logic as a module -->
  <script type="module" src="js/script.js"></script>
</body>
</html>
