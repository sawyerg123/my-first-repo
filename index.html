<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sawyer G Portfolio</title>
<style>
body, html { margin: 0; padding: 0; font-family: Arial, sans-serif; color: #f4f4f4; background: #000; overflow-x: hidden; }
.hero {
  position: relative;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #fff;
  overflow: hidden;
}
.hero h1 { font-size: 4rem; margin: 0; }
.background {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: -1;
}
.background canvas { width: 100%; height: 100%; }
.section { padding: 60px 20px; }
.section h2 { font-size: 2rem; margin-bottom: 20px; }
.projects {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
}
.project-card {
  background: rgba(255, 255, 255, 0.05);
  border-radius: 8px;
  padding: 20px;
  width: 300px;
  min-height: 200px;
  transition: transform 0.3s ease, background 0.3s ease;
}
.project-card:hover {
  transform: translateY(-5px);
  background: rgba(255, 255, 255, 0.1);
}
footer {
  padding: 20px;
  text-align: center;
  background: #111;
}
</style>
</head>
<body>
<div class="hero">
  <div class="background">
    <canvas id="bgCanvas"></canvas>
  </div>
  <div>
    <h1>Hello, I'm Sawyer G</h1>
    <p>HCDD Junior at Penn State | UX Design & Marketing Enthusiast | President of Kappa Sigma</p>
  </div>
</div>
<section class="section" id="projects">
  <h2>Projects</h2>
  <div class="projects">
    <div class="project-card">
      <h3>Project 1</h3>
      <p>Description of project goes here.</p>
    </div>
    <div class="project-card">
      <h3>Project 2</h3>
      <p>Description of project goes here.</p>
    </div>
    <div class="project-card">
      <h3>Project 3</h3>
      <p>Description of project goes here.</p>
    </div>
  </div>
</section>
<footer>
  &copy; 2025 Sawyer G. All rights reserved.
</footer>
<script>
// interactive background particles
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();
let circles = [];
for (let i = 0; i < 60; i++) {
  circles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 3 + 1,
    vx: (Math.random() - 0.5) * 0.5,
    vy: (Math.random() - 0.5) * 0.5
  });
}
function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.07)';
  circles.forEach(c => {
    c.x += c.vx;
    c.y += c.vy;
    if (c.x < 0 || c.x > canvas.width) c.vx *= -1;
    if (c.y < 0 || c.y > canvas.height) c.vy *= -1;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();
  });
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
